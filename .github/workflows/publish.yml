name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write # required for OIDC on the calling job
jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    uses: unabandoned/.github/.github/workflows/reusable-publish.yml@6351221a594b8327d4e73b0cd9e2c798189616d2 # v1.3.5
    with:
      # `files` ships only dist/, which rollup generates; npm publish
      # --ignore-scripts never runs a prepack, so the build has to happen here.
      build-for-publish: true
    secrets: inherit
