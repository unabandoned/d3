name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ci:
    permissions:
      contents: read
    uses: unabandoned/.github/.github/workflows/reusable-ci.yml@6351221a594b8327d4e73b0cd9e2c798189616d2 # v1.3.5
    with:
      node-versions: '[22, 24]'
      # The published files are rollup bundles in dist/, generated by the build.
      has-build: true
