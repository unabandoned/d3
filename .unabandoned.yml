schema: 1

package: "@unabandoned/d3"

upstream:
  repo: d3/d3
  reason: "no release since 7.9.0 in 2024-03; the thirty d3-* modules it re-exports are mostly unreleased since 2021-2023"

  # Upstream commits looked at, so the drift report stops re-reporting them and
  # a genuinely new commit stands out.
  reviewed:
    - sha: 3d1a90c3
      decision: ported
      note: >-
        fixes the Bruls et al. paper link in docs/d3-hierarchy/treemap.md (the
        old www.win.tue.nl/~vanwijk path now 301s); cherry-picked unchanged
    - sha: 78db4998
      decision: declined
      note: >-
        upstream's 7.9.1 release: it moves to pnpm, vitest and eslint 10, edits
        workflows this fork does not have, and raises d3-* ranges that our
        pinned devDependencies already meet; its rollup config externalises
        d3-* in the ES builds, the opposite of this fork's zero-dependency
        bundle, and its gallery.data.js change is for a docs build we do not run
    - sha: 374c4b32
      decision: declined
      note: "edits docs/.vitepress/config.ts for upstream's docs site build; this fork builds no docs site"
    - sha: db118c93
      decision: declined
      note: >-
        upstream's 7.9.2 version bump and d3-delaunay ^6.0.6; our devDependency
        is already pinned at 6.0.6, and versions here come from release-please

summary: >-
  D3 (Data-Driven Documents): scales, axes, shapes, colour interpolation,
  selections and the rest of the d3-* modules, re-exported as one package.

why-forked: >-
  CyberChef imports d3 at runtime for its chart operations. Upstream d3 pulls
  in a 37-package runtime tree (30 d3-* modules plus internmap, delaunator,
  robust-predicates and d3-dsv's CLI deps commander, iconv-lite, rw and
  safer-buffer), 33 of them abandoned. Forking every module is out of
  proportion, so this fork publishes a self-contained rollup bundle with zero
  runtime dependencies: the modules are devDependencies, Renovate keeps them
  current, and a bump of any bundled module is typed build(deps) so it
  releases.

status: active

used-by:
  - consumer: TheTechNetwork/CyberChef
    purpose: "chart operations (Entropy, Heatmap chart, Hex density chart, Scatter chart, Series chart)"

tags: [visualization, charts, svg, bundled]
